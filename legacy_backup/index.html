<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-1">Bienvenido</h2>
                        <p class="text-center text-muted mb-4">Ingresa tus credenciales para continuar</p>

                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario (Correo Electrónico)</label>
                                <input type="email" class="form-control" id="username" placeholder="correo@ejemplo.com"
                                    required>
                                <div class="invalid-feedback" id="emailErrorText">¡Ingresa un correo electrónico válido!
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="Tu contraseña"
                                    required>
                                <div class="invalid-feedback">¡La contraseña es requerida!</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-login">Iniciar Sesión</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>

</html>
